name: release

# Publish runtime changes merged into main. Version follows public entrypoint
# changes and Conventional Commit messages since latest release tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shipit-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use latest main
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

      - name: Check versioning rules
        run: python3 -m unittest discover -s tests -p 'test_release_version.py'

      - name: Calculate and write version
        id: version
        run: python3 scripts/release_version.py --write --github-output "$GITHUB_OUTPUT"

      - name: Commit version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json skills/init/assets/config-template.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): v$VERSION"
            git push origin HEAD:main
          fi

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$(git rev-parse HEAD)" \
              --title "v$VERSION" --generate-notes --latest
          fi
